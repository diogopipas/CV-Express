<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sync Diagnostic</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a1a; color: #fff; }
        .container { max-width: 800px; margin: 0 auto; }
        .section { background: #2a2a2a; padding: 20px; margin: 10px 0; border-radius: 8px; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .warning { color: #fbbf24; }
        button { background: #8b5cf6; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #7c3aed; }
        pre { background: #1a1a1a; padding: 10px; border-radius: 5px; overflow-x: auto; }
        .status { font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Email Sync Diagnostic Tool</h1>
        
        <div class="section">
            <h2>1. Authentication Status</h2>
            <div id="auth-status">Checking...</div>
            <button onclick="checkAuth()">Check Authentication</button>
        </div>

        <div class="section">
            <h2>2. Email Connection Status</h2>
            <div id="email-status">Checking...</div>
            <button onclick="checkEmailStatus()">Check Email Status</button>
        </div>

        <div class="section">
            <h2>3. Test Email Sync</h2>
            <div id="sync-status">Ready to test...</div>
            <button onclick="testEmailSync()">Test Email Sync</button>
        </div>

        <div class="section">
            <h2>4. Backend Health Check</h2>
            <div id="backend-status">Checking...</div>
            <button onclick="checkBackend()">Check Backend</button>
        </div>

        <div class="section">
            <h2>5. OAuth Configuration</h2>
            <div id="oauth-status">Checking...</div>
            <button onclick="checkOAuth()">Check OAuth Config</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5001/api';

        async function checkAuth() {
            const statusDiv = document.getElementById('auth-status');
            statusDiv.innerHTML = 'Checking authentication...';
            
            try {
                const token = localStorage.getItem('token');
                const authStorage = localStorage.getItem('auth-storage');
                
                if (!token && !authStorage) {
                    statusDiv.innerHTML = '<span class="error">❌ No authentication token found</span><br>Please log in to the application first.';
                    return;
                }
                
                // Try to get current user
                const response = await fetch(`${API_URL}/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${token || JSON.parse(authStorage).state.token}`
                    }
                });
                
                if (response.ok) {
                    const user = await response.json();
                    statusDiv.innerHTML = `<span class="success">✅ Authenticated as: ${user.email}</span>`;
                } else {
                    statusDiv.innerHTML = '<span class="error">❌ Authentication failed - token may be expired</span>';
                }
            } catch (error) {
                statusDiv.innerHTML = `<span class="error">❌ Authentication error: ${error.message}</span>`;
            }
        }

        async function checkEmailStatus() {
            const statusDiv = document.getElementById('email-status');
            statusDiv.innerHTML = 'Checking email connection...';
            
            try {
                const token = localStorage.getItem('token') || JSON.parse(localStorage.getItem('auth-storage')).state.token;
                
                const response = await fetch(`${API_URL}/email-oauth/status`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const emailData = data.data;
                    
                    let status = '';
                    if (emailData.emailConnected) {
                        status += `<span class="success">✅ Email Connected: ${emailData.connectedEmail}</span><br>`;
                        status += `<span class="success">Provider: ${emailData.emailProvider}</span><br>`;
                        status += `<span class="success">Last Sync: ${emailData.lastEmailSync || 'Never'}</span>`;
                    } else {
                        status = '<span class="error">❌ Email not connected</span>';
                    }
                    
                    statusDiv.innerHTML = status;
                } else {
                    const error = await response.json();
                    statusDiv.innerHTML = `<span class="error">❌ Error: ${error.error}</span>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
            }
        }

        async function testEmailSync() {
            const statusDiv = document.getElementById('sync-status');
            statusDiv.innerHTML = 'Testing email sync...';
            
            try {
                const token = localStorage.getItem('token') || JSON.parse(localStorage.getItem('auth-storage')).state.token;
                
                const response = await fetch(`${API_URL}/email-oauth/sync`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    statusDiv.innerHTML = `<span class="success">✅ Sync successful: ${data.message}</span>`;
                } else {
                    const error = await response.json();
                    statusDiv.innerHTML = `<span class="error">❌ Sync failed: ${error.error}</span>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<span class="error">❌ Sync error: ${error.message}</span>`;
            }
        }

        async function checkBackend() {
            const statusDiv = document.getElementById('backend-status');
            statusDiv.innerHTML = 'Checking backend...';
            
            try {
                const response = await fetch('http://localhost:5001/health');
                
                if (response.ok) {
                    const data = await response.json();
                    statusDiv.innerHTML = `<span class="success">✅ Backend running: ${data.message}</span>`;
                } else {
                    statusDiv.innerHTML = '<span class="error">❌ Backend not responding</span>';
                }
            } catch (error) {
                statusDiv.innerHTML = `<span class="error">❌ Backend error: ${error.message}</span>`;
            }
        }

        async function checkOAuth() {
            const statusDiv = document.getElementById('oauth-status');
            statusDiv.innerHTML = 'Checking OAuth configuration...';
            
            try {
                const response = await fetch(`${API_URL}/email-oauth/connect`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ provider: 'gmail' })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    statusDiv.innerHTML = `<span class="success">✅ OAuth configured: ${data.redirectUrl}</span>`;
                } else {
                    const error = await response.json();
                    statusDiv.innerHTML = `<span class="error">❌ OAuth error: ${error.error}</span>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<span class="error">❌ OAuth error: ${error.message}</span>`;
            }
        }

        // Auto-run checks on page load
        window.onload = function() {
            checkBackend();
            checkOAuth();
        };
    </script>
</body>
</html>
